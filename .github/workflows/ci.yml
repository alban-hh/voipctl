name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            toolchain: stable
          - os: ubuntu-24.04
            toolchain: '1.88.0'
          - os: macos-latest
            toolchain: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - if: matrix.toolchain == 'stable'
        run: cargo +${{ matrix.toolchain }} fmt --all -- --check
      - if: matrix.toolchain == 'stable'
        run: cargo +${{ matrix.toolchain }} clippy --locked --all-targets -- -D warnings
      - run: cargo +${{ matrix.toolchain }} test --locked
      - run: cargo +${{ matrix.toolchain }} build --release --locked
