name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          - os: ubuntu-latest
            toolchain: '1.88.0'
          - os: macos-latest
            toolchain: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - if: matrix.toolchain == 'stable'
        run: cargo +${{ matrix.toolchain }} fmt --all -- --check
      - if: matrix.toolchain == 'stable'
        run: cargo +${{ matrix.toolchain }} clippy --locked --all-targets -- -D warnings
      - run: cargo +${{ matrix.toolchain }} test --locked
      - run: cargo +${{ matrix.toolchain }} build --release --locked
